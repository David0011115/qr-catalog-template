 <path d="M175-25C330 115 410 265 420 410S390 565 365 635" stroke="#d0fff1" stroke-width="10" opacity=".12" filter="url(#soft)"/>
 <path d="M220-25C360 115 435 260 440 405S410 560 385 630" stroke="#a7fff0" stroke-width="3.5" opacity=".7"/>
 <path d="M300-35C445 110 515 260 525 405S500 565 475 650" stroke="#6effdc" stroke-width="2" opacity=".52"/>
 <path d="M445-30C585 105 665 260 675 410S650 570 620 655" stroke="#c6fff2" stroke-width="11" opacity=".13" filter="url(#soft)"/>
 <path d="M485-25C620 115 690 260 700 405S675 570 650 640" stroke="#a9fff0" stroke-width="3.5" opacity=".66"/>
 <path d="M570-25C715 120 785 270 790 420S760 570 740 650" stroke="#63f8dc" stroke-width="2.5" opacity=".48"/>
 <path d="M705-25C850 105 925 260 935 410S905 565 875 640" stroke="#d6d1ff" stroke-width="10" opacity=".12" filter="url(#soft)"/>
 <path d="M750-25C885 115 960 260 965 410S940 565 915 630" stroke="#c1fff0" stroke-width="3" opacity=".64"/>
 <path d="M980-25C1100 110 1175 250 1185 390S1160 545 1135 620" stroke="#9affdf" stroke-width="3" opacity=".55"/>
</g>
<!-- soft shafts of reflected light within the curtains -->
<path d="M270 20Q390 185 425 390T380 620L350 620Q405 420 355 235Z" fill="url(#curtainBright)" opacity=".52"/>
<path d="M535 0Q665 185 700 400T650 650L620 650Q675 420 620 235Z" fill="url(#curtainBright)" opacity=".48"/>
<path d="M800 0Q930 185 965 400T915 640L885 640Q940 420 885 235Z" fill="url(#curtainBright)" opacity=".44"/>
