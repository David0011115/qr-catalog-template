<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="night" x2="0" y2="1"><stop stop-color="#020817"/><stop offset=".34" stop-color="#071c31"/><stop offset=".7" stop-color="#102e42"/><stop offset="1" stop-color="#071624"/></linearGradient>
 <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#44ffd0" stop-opacity="0"/><stop offset=".18" stop-color="#55ffd0" stop-opacity=".78"/><stop offset=".42" stop-color="#35c9e8" stop-opacity=".64"/><stop offset=".66" stop-color="#8d83ff" stop-opacity=".55"/><stop offset=".86" stop-color="#d18cff" stop-opacity=".42"/><stop offset="1" stop-color="#5effdf" stop-opacity="0"/></linearGradient>
 <linearGradient id="ribbon2" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8bffe3" stop-opacity="0"/><stop offset=".35" stop-color="#61ffe0" stop-opacity=".75"/><stop offset=".7" stop-color="#4ec9ec" stop-opacity=".36"/><stop offset="1" stop-color="#4ec9ec" stop-opacity="0"/></linearGradient>
