<linearGradient id="lake" x2="0" y2="1"><stop stop-color="#28566a"/><stop offset=".25" stop-color="#102f43"/><stop offset="1" stop-color="#020812"/></linearGradient>
<radialGradient id="warm"><stop stop-color="#ffc878" stop-opacity=".8"/><stop offset="1" stop-color="#ffb45c" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="26"/></filter>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
