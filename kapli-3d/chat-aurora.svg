<path d="M1000 762L1075 732 1140 748 1095 760 1178 778 1050 776Z" fill="#b5dce0" opacity=".3"/>
<path d="M1020 790L1110 775 1200 795" fill="none" stroke="#c4f2ef" stroke-width="2" opacity=".14"/>
<!-- tiny distant stars and ice glints -->
<g fill="#e3fff8" opacity=".8"><circle cx="250" cy="690" r="1.5"/><circle cx="355" cy="742" r="1.1"/><circle cx="825" cy="700" r="1.6"/><circle cx="950" cy="735" r="1.1"/><circle cx="620" cy="785" r="1.2"/></g>
<path d="M0 870Q220 835 430 870T850 865T1200 870V900H0Z" fill="#020812" opacity=".72"/>
</svg>