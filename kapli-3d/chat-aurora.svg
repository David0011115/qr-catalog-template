 <linearGradient id="reflection" x2="0" y2="1"><stop stop-color="#6affd8" stop-opacity=".5"/><stop offset=".4" stop-color="#63bfe9" stop-opacity=".18"/><stop offset="1" stop-color="#63bfe9" stop-opacity="0"/></linearGradient>
