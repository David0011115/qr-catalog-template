<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<!-- «Аврора»: фиолетовая полярная ночь — живые занавесы сияния над горами и их отражение в зеркальном озере -->
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#05021a"/><stop offset=".35" stop-color="#170a44"/><stop offset=".62" stop-color="#2a1260"/><stop offset=".75" stop-color="#1a2a5c"/><stop offset="1" stop-color="#0a1234"/>
  </linearGradient>
  <!-- curtains: bright lower hem, colour fading upward -->
  <linearGradient id="curG" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#d8fff4" stop-opacity="0"/><stop offset=".05" stop-color="#b8fff0" stop-opacity="1"/><stop offset=".25" stop-color="#3dffb0" stop-opacity=".85"/>
    <stop offset=".5" stop-color="#22e6ff" stop-opacity=".5"/><stop offset=".78" stop-color="#b26bff" stop-opacity=".35"/><stop offset="1" stop-color="#ff4fd8" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="curV" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#ffd6f6" stop-opacity="0"/><stop offset=".07" stop-color="#ff8ae6" stop-opacity=".95"/><stop offset=".35" stop-color="#c06bff" stop-opacity=".7"/>
    <stop offset=".75" stop-color="#6a4dff" stop-opacity=".3"/><stop offset="1" stop-color="#6a4dff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="curB" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#c8f6ff" stop-opacity="0"/><stop offset=".08" stop-color="#7fe8ff" stop-opacity=".75"/><stop offset=".4" stop-color="#3d8bff" stop-opacity=".35"/><stop offset="1" stop-color="#3d8bff" stop-opacity="0"/>
  </linearGradient>
  <!-- vertical rays inside the curtains -->
  <pattern id="rays" width="26" height="900" patternUnits="userSpaceOnUse">
    <rect width="26" height="900" fill="#9a9a9a"/><rect x="2" width="5" height="900" fill="#fff"/><rect x="14" width="2" height="900" fill="#e0e0e0"/><rect x="20" width="3" height="900" fill="#6a6a6a"/>
    <animateTransform attributeName="patternTransform" type="translate" values="0 0;26 0" dur="11s" repeatCount="indefinite"/>
  </pattern>
  <filter id="raySoft"><feGaussianBlur stdDeviation="1.6 0"/></filter>
  <mask id="rayMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1600" height="900"><rect width="1600" height="900" fill="url(#rays)" filter="url(#raySoft)"/></mask>
  <linearGradient id="edgeFade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000"/><stop offset=".12" stop-color="#fff"/><stop offset=".88" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
  <mask id="lakeFade" maskUnits="userSpaceOnUse" x="0" y="690" width="1600" height="210"><rect y="690" width="1600" height="210" fill="url(#edgeFade)"/></mask>
  <filter id="soft" filterUnits="userSpaceOnUse" x="-200" y="-100" width="2000" height="1100"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="soft2" filterUnits="userSpaceOnUse" x="-200" y="-100" width="2000" height="1100"><feGaussianBlur stdDeviation="16"/></filter>
  <filter id="glowf" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  <radialGradient id="horizonGlow" cx=".5" cy="1" r=".7"><stop offset="0" stop-color="#b26bff" stop-opacity=".35"/><stop offset="1" stop-color="#3dffa2" stop-opacity="0"/></radialGradient>
  <linearGradient id="farMt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a5aa8"/><stop offset="1" stop-color="#1c1f52"/></linearGradient>
  <linearGradient id="nearMt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f3070"/><stop offset="1" stop-color="#0d0f30"/></linearGradient>
  <linearGradient id="snowCap" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#f4f0ff"/><stop offset=".55" stop-color="#b9b4f0"/><stop offset="1" stop-color="#b9b4f0" stop-opacity="0"/></linearGradient>
  <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1a58"/><stop offset=".4" stop-color="#0e0c34"/><stop offset="1" stop-color="#05041a"/></linearGradient>
  <linearGradient id="refl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3dffa2" stop-opacity=".35"/><stop offset="1" stop-color="#3dffa2" stop-opacity="0"/></linearGradient>
  <radialGradient id="warm"><stop offset="0" stop-color="#ffcf7a" stop-opacity=".9"/><stop offset=".4" stop-color="#ff9a3d" stop-opacity=".35"/><stop offset="1" stop-color="#ff9a3d" stop-opacity="0"/></radialGradient>
  <symbol id="pine" viewBox="0 0 40 100"><path d="M20 0 L28 22 L24 22 L33 44 L27 44 L38 70 L23 70 L23 100 L17 100 L17 70 L2 70 L13 44 L7 44 L16 22 L12 22 Z"/></symbol>
</defs>

<rect width="1600" height="900" fill="url(#sky)"/>

<!-- stars -->
<g fill="#fff">
  <circle cx="90" cy="60" r="1.3"><animate attributeName="opacity" values=".3;1;.3" dur="3.1s" repeatCount="indefinite"/></circle>
  <circle cx="240" cy="140" r="1"/><circle cx="380" cy="40" r="1.6"><animate attributeName="opacity" values="1;.3;1" dur="4.2s" repeatCount="indefinite"/></circle>
  <circle cx="520" cy="110" r="1"/><circle cx="660" cy="30" r="1.2"/><circle cx="790" cy="90" r="1.5"><animate attributeName="opacity" values=".4;1;.4" dur="2.6s" repeatCount="indefinite"/></circle>
  <circle cx="930" cy="50" r="1"/><circle cx="1060" cy="130" r="1.3"/><circle cx="1190" cy="35" r="1.7"><animate attributeName="opacity" values="1;.35;1" dur="3.6s" repeatCount="indefinite"/></circle>
  <circle cx="1320" cy="100" r="1"/><circle cx="1460" cy="55" r="1.4"/><circle cx="1550" cy="160" r="1"/><circle cx="160" cy="220" r=".9"/><circle cx="1400" cy="230" r=".9"/>
  <circle cx="700" cy="200" r=".8"/><circle cx="1000" cy="240" r=".8"/><circle cx="330" cy="260" r=".8"/>
</g>
<!-- a shooting star now and then -->
<line x1="0" y1="0" x2="70" y2="18" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0">
  <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.86;.9;.95;1" dur="11s" repeatCount="indefinite"/>
  <animateTransform attributeName="transform" type="translate" values="1250 60;1250 60;1050 120;950 150;950 150" keyTimes="0;.86;.9;.95;1" dur="11s" repeatCount="indefinite"/>
</line>

<!-- aurora: a wide soft glow, then three curtains that sway and breathe -->
<rect width="1600" height="900" fill="url(#horizonGlow)"/>
<g filter="url(#soft2)" opacity=".55">
  <path fill="url(#curG)" d="M-50 520 C250 380 450 470 700 380 S1150 300 1650 420 L1650 60 L-50 60 Z">
    <animate attributeName="d" dur="16s" repeatCount="indefinite" values="M-50 520 C250 380 450 470 700 380 S1150 300 1650 420 L1650 60 L-50 60 Z;M-50 480 C220 420 480 400 720 430 S1180 340 1650 380 L1650 60 L-50 60 Z;M-50 520 C250 380 450 470 700 380 S1150 300 1650 420 L1650 60 L-50 60 Z"/>
  </path>
</g>
<g mask="url(#rayMask)">
  <g filter="url(#soft)">
    <!-- green main curtain -->
    <path fill="url(#curG)" d="M-40 470 C160 330 330 430 520 330 S880 260 1080 330 S1420 260 1660 340 L1660 80 C1300 40 900 120 600 60 S100 140 -40 120 Z">
      <animate attributeName="d" dur="12s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"
        values="M-40 470 C160 330 330 430 520 330 S880 260 1080 330 S1420 260 1660 340 L1660 80 C1300 40 900 120 600 60 S100 140 -40 120 Z;
                M-40 430 C190 380 360 360 560 380 S900 290 1110 300 S1430 320 1660 300 L1660 80 C1300 60 900 90 600 80 S100 110 -40 120 Z;
                M-40 470 C160 330 330 430 520 330 S880 260 1080 330 S1420 260 1660 340 L1660 80 C1300 40 900 120 600 60 S100 140 -40 120 Z"/>
      <animate attributeName="opacity" values=".85;1;.7;.85" dur="7s" repeatCount="indefinite"/>
    </path>
    <!-- violet curtain behind on the right -->
    <path fill="url(#curV)" opacity=".75" d="M560 300 C640 330 720 360 800 350 C930 280 1080 330 1230 260 S1500 230 1660 270 L1660 40 C1450 30 1250 80 1050 40 S760 40 560 300 Z">
      <animate attributeName="d" dur="15s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"
        values="M560 300 C640 330 720 360 800 350 C930 280 1080 330 1230 260 S1500 230 1660 270 L1660 40 C1450 30 1250 80 1050 40 S760 40 560 300 Z;
                M540 280 C630 300 700 320 780 320 C940 320 1090 280 1250 300 S1490 250 1660 240 L1660 40 C1450 50 1250 60 1050 60 S760 50 540 280 Z;
                M560 300 C640 330 720 360 800 350 C930 280 1080 330 1230 260 S1500 230 1660 270 L1660 40 C1450 30 1250 80 1050 40 S760 40 560 300 Z"/>
      <animate attributeName="opacity" values=".55;.85;.55" dur="9s" repeatCount="indefinite"/>
    </path>
    <!-- cyan ribbon on the left -->
    <path fill="url(#curB)" opacity=".7" d="M-40 360 C80 300 200 340 330 270 S560 230 760 280 C820 300 880 290 900 270 C860 200 820 120 760 70 C480 60 300 100 150 70 S0 90 -40 90 Z">
      <animate attributeName="d" dur="10s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"
        values="M-40 360 C80 300 200 340 330 270 S560 230 760 280 C820 300 880 290 900 270 C860 200 820 120 760 70 C480 60 300 100 150 70 S0 90 -40 90 Z;
                M-40 320 C100 330 220 290 350 300 S580 270 770 250 C830 240 870 260 900 250 C860 180 820 110 760 80 C480 80 300 80 150 90 S0 80 -40 90 Z;
                M-40 360 C80 300 200 340 330 270 S560 230 760 280 C820 300 880 290 900 270 C860 200 820 120 760 70 C480 60 300 100 150 70 S0 90 -40 90 Z"/>
    </path>
  </g>
  <!-- the bright lower hems of the curtains -->
  <g fill="none" stroke-linecap="round" filter="url(#glowf)">
    <path stroke="#c8ffe9" stroke-width="3" stroke-opacity=".75" d="M-40 470 C160 330 330 430 520 330 S880 260 1080 330 S1420 260 1660 340">
      <animate attributeName="d" dur="12s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"
        values="M-40 470 C160 330 330 430 520 330 S880 260 1080 330 S1420 260 1660 340;M-40 430 C190 380 360 360 560 380 S900 290 1110 300 S1430 320 1660 300;M-40 470 C160 330 330 430 520 330 S880 260 1080 330 S1420 260 1660 340"/>
    </path>
    <path stroke="#ffd0f3" stroke-width="2" stroke-opacity=".55" d="M780 360 C930 280 1080 330 1230 260 S1500 230 1660 270">
      <animate attributeName="d" dur="15s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"
        values="M780 360 C930 280 1080 330 1230 260 S1500 230 1660 270;M760 320 C940 320 1090 280 1250 300 S1490 250 1660 240;M780 360 C930 280 1080 330 1230 260 S1500 230 1660 270"/>
    </path>
  </g>
</g>

<!-- far mountains with snow -->
<path fill="url(#farMt)" d="M0 600 L120 540 L210 565 L330 470 L420 520 L520 450 L640 535 L760 480 L860 520 L980 430 L1100 510 L1220 470 L1330 530 L1450 480 L1600 545 L1600 650 L0 650 Z"/>
<g fill="url(#snowCap)" opacity=".9">
  <path d="M330 470 L300 495 L318 492 L330 505 L345 490 L362 498 Z"/><path d="M520 450 L488 478 L505 474 L522 488 L536 472 L556 480 Z"/>
  <path d="M980 430 L944 462 L963 457 L980 472 L996 456 L1018 466 Z"/><path d="M1220 470 L1190 494 L1207 491 L1222 503 L1236 490 L1254 497 Z"/>
</g>
<!-- near mountains -->
<path fill="url(#nearMt)" d="M0 650 L160 560 L260 600 L400 520 L520 590 L650 560 L780 610 L900 545 L1030 600 L1180 540 L1300 600 L1440 560 L1600 610 L1600 700 L0 700 Z"/>
<g fill="#d8d2ff" opacity=".7">
  <path d="M400 520 L372 545 L390 541 L402 553 L416 540 L432 548 Z"/><path d="M900 545 L872 570 L890 566 L903 578 L917 565 L934 573 Z"/><path d="M1180 540 L1150 566 L1168 562 L1182 575 L1196 561 L1214 569 Z"/>
</g>

<!-- frozen lake with the aurora reflection -->
<rect y="690" width="1600" height="210" fill="url(#lake)"/>
<g mask="url(#lakeFade)" opacity=".8">
  <g transform="matrix(1 0 0 -0.46 0 880)" filter="url(#soft)">
    <path fill="url(#curG)" d="M-40 470 C160 330 330 430 520 330 S880 260 1080 330 S1420 260 1660 340 L1660 80 C1300 40 900 120 600 60 S100 140 -40 120 Z">
      <animate attributeName="d" dur="12s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"
        values="M-40 470 C160 330 330 430 520 330 S880 260 1080 330 S1420 260 1660 340 L1660 80 C1300 40 900 120 600 60 S100 140 -40 120 Z;M-40 430 C190 380 360 360 560 380 S900 290 1110 300 S1430 320 1660 300 L1660 80 C1300 60 900 90 600 80 S100 110 -40 120 Z;M-40 470 C160 330 330 430 520 330 S880 260 1080 330 S1420 260 1660 340 L1660 80 C1300 40 900 120 600 60 S100 140 -40 120 Z"/>
    </path>
    <path fill="url(#curV)" opacity=".7" d="M560 300 C640 330 720 360 800 350 C930 280 1080 330 1230 260 S1500 230 1660 270 L1660 40 C1450 30 1250 80 1050 40 S760 40 560 300 Z"/>
  </g>
  <rect y="690" width="1600" height="210" fill="#0a0828" opacity=".35">
    <animate attributeName="opacity" values=".35;.2;.35" dur="7s" repeatCount="indefinite"/>
  </rect>
</g>
<clipPath id="lakeClip"><rect y="690" width="1600" height="210"/></clipPath>
<g clip-path="url(#lakeClip)" opacity=".55" transform="translate(0 1380) scale(1 -1)">
  <path fill="#2f3070" d="M0 650 L160 560 L260 600 L400 520 L520 590 L650 560 L780 610 L900 545 L1030 600 L1180 540 L1300 600 L1440 560 L1600 610 L1600 700 L0 700 Z"/>
</g>
<g stroke="#bfefff" stroke-opacity=".18" stroke-width="1.5">
  <line x1="180" y1="742" x2="430" y2="742"/><line x1="620" y1="768" x2="980" y2="768"/><line x1="1100" y1="748" x2="1400" y2="748"/><line x1="300" y1="805" x2="560" y2="805"/><line x1="900" y1="830" x2="1250" y2="830"/>
</g>

<!-- spruce forest on the shore -->
<g fill="#07061c">
  <use href="#pine" x="0" y="560" width="46" height="135"/><use href="#pine" x="36" y="590" width="36" height="105"/><use href="#pine" x="64" y="548" width="52" height="150"/>
  <use href="#pine" x="108" y="600" width="32" height="95"/><use href="#pine" x="138" y="575" width="42" height="122"/><use href="#pine" x="176" y="610" width="30" height="86"/>
  <use href="#pine" x="1380" y="580" width="42" height="120"/><use href="#pine" x="1416" y="555" width="50" height="145"/><use href="#pine" x="1460" y="598" width="34" height="100"/>
  <use href="#pine" x="1490" y="565" width="46" height="132"/><use href="#pine" x="1530" y="600" width="34" height="96"/><use href="#pine" x="1560" y="570" width="44" height="128"/>
</g>
<g fill="#0f0d32">
  <use href="#pine" x="230" y="630" width="26" height="70"/><use href="#pine" x="258" y="640" width="22" height="60"/><use href="#pine" x="1320" y="628" width="26" height="72"/><use href="#pine" x="1346" y="642" width="20" height="58"/>
</g>

<!-- light snowfall -->
<g fill="#fff" opacity=".7">
  <circle cx="200" cy="0" r="1.6"><animate attributeName="cy" values="-10;910" dur="14s" repeatCount="indefinite"/><animate attributeName="cx" values="200;260;200" dur="14s" repeatCount="indefinite"/></circle>
  <circle cx="520" cy="0" r="1.2"><animate attributeName="cy" values="-10;910" dur="18s" begin="3s" repeatCount="indefinite"/></circle>
  <circle cx="860" cy="0" r="1.8"><animate attributeName="cy" values="-10;910" dur="15s" begin="6s" repeatCount="indefinite"/><animate attributeName="cx" values="860;820;860" dur="15s" repeatCount="indefinite"/></circle>
  <circle cx="1180" cy="0" r="1.3"><animate attributeName="cy" values="-10;910" dur="17s" begin="1s" repeatCount="indefinite"/></circle>
  <circle cx="1450" cy="0" r="1.6"><animate attributeName="cy" values="-10;910" dur="13s" begin="8s" repeatCount="indefinite"/><animate attributeName="cx" values="1450;1500;1450" dur="13s" repeatCount="indefinite"/></circle>
  <circle cx="680" cy="0" r="1"><animate attributeName="cy" values="-10;910" dur="20s" begin="10s" repeatCount="indefinite"/></circle>
</g>
</svg>
