<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="sky" x2="0" y2="1"><stop stop-color="#020611"/><stop offset=".45" stop-color="#0a1d32"/><stop offset="1" stop-color="#071522"/></linearGradient>
<radialGradient id="horizon"><stop stop-color="#72f6d9" stop-opacity=".35"/><stop offset="1" stop-color="#071522" stop-opacity="0"/></radialGradient>
<linearGradient id="veil" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#53fbd7" stop-opacity="0"/><stop offset=".35" stop-color="#65f5d6" stop-opacity=".62"/><stop offset=".58" stop-color="#80c9ff" stop-opacity=".42"/><stop offset=".8" stop-color="#c19aff" stop-opacity=".2"/><stop offset="1" stop-color="#53fbd7" stop-opacity="0"/></linearGradient>
<linearGradient id="ridge" x2="0" y2="1"><stop stop-color="#7895a5"/><stop offset=".25" stop-color="#304b61"/><stop offset="1" stop-color="#0a1c2c"/></linearGradient>
<linearGradient id="snow" x2=".2" y2="1"><stop stop-color="#f0ffff"/><stop offset=".4" stop-color="#a9cbd5"/><stop offset="1" stop-color="#496a7e"/></linearGradient>
