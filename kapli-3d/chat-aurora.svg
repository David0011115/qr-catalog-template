<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#020713"/><stop offset=".42" stop-color="#081a2c"/><stop offset=".78" stop-color="#102d3c"/><stop offset="1" stop-color="#071624"/></linearGradient>
 <radialGradient id="air"><stop stop-color="#55e8d2" stop-opacity=".3"/><stop offset=".55" stop-color="#397f9c" stop-opacity=".12"/><stop offset="1" stop-color="#071624" stop-opacity="0"/></radialGradient>
 <linearGradient id="curtain" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#54ffd5" stop-opacity="0"/><stop offset=".2" stop-color="#69ffda" stop-opacity=".22"/><stop offset=".42" stop-color="#54e9e5" stop-opacity=".68"/><stop offset=".62" stop-color="#78baff" stop-opacity=".43"/><stop offset=".82" stop-color="#b38cff" stop-opacity=".27"/><stop offset="1" stop-color="#64ffe0" stop-opacity="0"/></linearGradient>
 <linearGradient id="curtainBright" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a6ffe9" stop-opacity="0"/><stop offset=".23" stop-color="#9dffe9" stop-opacity=".06"/><stop offset=".5" stop-color="#9dffe9" stop-opacity=".72"/><stop offset=".72" stop-color="#5dd8e9" stop-opacity=".3"/><stop offset="1" stop-color="#5dd8e9" stop-opacity="0"/></linearGradient>
 <linearGradient id="mountainFar" x2="0" y2="1"><stop stop-color="#718b9b"/><stop offset=".24" stop-color="#344f64"/><stop offset="1" stop-color="#0b1d30"/></linearGradient>
 <linearGradient id="mountainNear" x2=".1" y2="1"><stop stop-color="#29475b"/><stop offset=".35" stop-color="#132d42"/><stop offset="1" stop-color="#04111f"/></linearGradient>
 <linearGradient id="snow" x2=".2" y2="1"><stop stop-color="#f0ffff"/><stop offset=".32" stop-color="#a9cbd4"/><stop offset="1" stop-color="#416477"/></linearGradient>
 <linearGradient id="water" x2="0" y2="1"><stop stop-color="#17465a"/><stop offset=".24" stop-color="#0b2c42"/><stop offset="1" stop-color="#020914"/></linearGradient>
 <linearGradient id="waterGlow" x2="0" y2="1"><stop stop-color="#8affdf" stop-opacity=".4"/><stop offset=".25" stop-color="#6de2e8" stop-opacity=".18"/><stop offset="1" stop-color="#6de2e8" stop-opacity="0"/></linearGradient>
 <linearGradient id="mist" x2="0" y2="1"><stop stop-color="#a4fff0" stop-opacity="0"/><stop offset=".5" stop-color="#a4fff0" stop-opacity=".12"/><stop offset="1" stop-color="#a4fff0" stop-opacity="0"/></linearGradient>
 <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="24"/></filter>
 <filter id="haze" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
 <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
 <pattern id="stars" width="173" height="137" patternUnits="userSpaceOnUse"><circle cx="11" cy="19" r="1.2" fill="#e5ffff"/><circle cx="69" cy="55" r=".8" fill="#d6eeff"/><circle cx="142" cy="15" r="1.1" fill="#fff"/><circle cx="157" cy="104" r=".7" fill="#cafff0"/><circle cx="39" cy="119" r=".9" fill="#fff"/><circle cx="112" cy="82" r=".55" fill="#fff"/></pattern>
</defs>
<!-- cold polar night and distant atmospheric glow -->
<rect width="1200" height="900" fill="url(#sky)"/>
<rect width="1200" height="530" fill="url(#stars)" opacity=".78"/>
<ellipse cx="610" cy="420" rx="670" ry="390" fill="url(#air)"/>
<ellipse cx="600" cy="480" rx="540" ry="150" fill="#4debd0" opacity=".08" filter="url(#bloom)"/>
