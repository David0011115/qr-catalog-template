<path d="M0 590L105 470 175 535 300 285 405 470 510 370 650 565 790 300 925 510 1055 355 1200 565V900H0Z" fill="url(#mountainFar)"/>
<path d="M300 285L260 365 291 348 310 382 330 340 367 420 405 470 350 438 329 397 306 414 285 382 260 408Z" fill="url(#snow)" opacity=".95"/>
<path d="M790 300L744 385 780 365 801 399 824 360 865 435 925 510 866 469 834 418 807 439 783 402 748 428Z" fill="url(#snow)" opacity=".96"/>
<path d="M1055 355L1015 425 1047 407 1068 438 1090 405 1120 462 1200 565 1137 510 1100 464 1072 482 1048 449 1018 470Z" fill="url(#snow)" opacity=".82"/>
<path d="M95 470L120 505 165 535 137 526 105 513Z" fill="#c4e0e5" opacity=".24"/>
<!-- nearer, darker mountain walls -->
<path d="M0 620L135 535 245 615 405 510 525 620 650 555 795 635 930 520 1060 620 1200 555V900H0Z" fill="url(#mountainNear)"/>
<path d="M135 535L112 590 155 570 190 615 245 615 190 600 158 560Z" fill="#8aaab6" opacity=".25"/>
<path d="M405 510L365 570 407 552 440 590 480 602 438 570 414 540Z" fill="#b6d5dc" opacity=".22"/>
<path d="M930 520L890 580 934 560 972 602 1010 610 968 575 940 548Z" fill="#a9cbd4" opacity=".2"/>
<!-- dark tree line, varied heights and silhouettes -->
<path d="M0 665Q160 610 290 675T570 660T850 680T1200 650V900H0Z" fill="#041321"/>
<g fill="#03101c" opacity=".96">
 <path d="M24 682l30-106 30 106H67l27 49H16l27-49Z"/><path d="M94 700l23-82 23 82h-14l22 39H86l22-39Z"/>
 <path d="M165 692l32-112 32 112h-20l29 51h-82l29-51Z"/><path d="M1015 690l35-122 35 122h-22l31 55h-88l31-55Z"/>
 <path d="M1090 700l25-90 25 90h-15l24 43h-68l24-43Z"/><path d="M1160 685l28-100 28 100h-18l27 49h-74l27-49Z"/>
 <path d="M890 700l24-84 24 84h-15l23 40h-64l23-40Z"/>
</g>
<!-- fjord surface and its long, broken reflections -->
<path d="M0 650Q170 622 330 650T650 645T950 652T1200 640V900H0Z" fill="url(#water)"/>
<path d="M430 650Q600 625 790 650T1110 650L1200 900H250Z" fill="url(#waterGlow)" opacity=".7"/>
<ellipse cx="700" cy="658" rx="390" ry="36" fill="#65f6d7" opacity=".14" filter="url(#bloom)"/>
<g fill="none" stroke-linecap="round">
 <path d="M390 660Q550 670 720 660T1010 662" stroke="#a2ffe9" stroke-width="8" opacity=".2" filter="url(#soft)"/>
 <path d="M445 666q110 8 225 0m-285 23q170 10 340 0m-270 30q150 9 300 0m-210 34q120 8 245 0" stroke="#6ef5df" stroke-width="3" opacity=".35"/>
 <path d="M720 676q100 8 205 0m-175 34q115 8 225 0m-270 40q145 9 290 0" stroke="#9aaeff" stroke-width="2.5" opacity=".3"/>
 <path d="M500 785q90 5 180 0m-120 35q110 6 220 0" stroke="#58cbd5" stroke-width="2" opacity=".22"/>
</g>
<!-- low drifting mist separates the water from the mountains -->
<path d="M0 635Q180 610 350 638T700 632T1050 640T1200 625V700Q1000 680 820 700T450 690T0 705Z" fill="url(#mist)" opacity=".8" filter="url(#haze)"/>
