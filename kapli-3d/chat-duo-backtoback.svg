<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<!-- «Плечом к плечу»: награда за 20 забегов в «Спине к спине». Две капли стоят спиной к спине под щитом, вокруг кружат боссы в коронах, с неба падают метеоры -->
<defs>
<radialGradient id="bg" cx=".5" cy=".62" r=".8"><stop offset="0" stop-color="#0d2a2e"/><stop offset=".55" stop-color="#081626"/><stop offset="1" stop-color="#05040f"/></radialGradient>
<pattern id="grid" width="90" height="90" patternUnits="userSpaceOnUse"><path d="M90 0H0V90" fill="none" stroke="#3dffa2" stroke-opacity=".08" stroke-width="1.5"/></pattern>
<radialGradient id="shield"><stop offset=".7" stop-color="#3dffa2" stop-opacity="0"/><stop offset=".93" stop-color="#3dffa2" stop-opacity=".18"/><stop offset="1" stop-color="#3dffa2" stop-opacity=".5"/></radialGradient>
<radialGradient id="cyanDrop" cx=".35" cy=".3"><stop offset="0" stop-color="#ffffff"/><stop offset=".3" stop-color="#9ff6ff"/><stop offset=".75" stop-color="#22c8e6"/><stop offset="1" stop-color="#0b4a66"/></radialGradient>
<radialGradient id="greenDrop" cx=".35" cy=".3"><stop offset="0" stop-color="#ffffff"/><stop offset=".3" stop-color="#b8ffd9"/><stop offset=".75" stop-color="#3dffa2"/><stop offset="1" stop-color="#0a5a3a"/></radialGradient>
<radialGradient id="boss" cx=".35" cy=".3"><stop offset="0" stop-color="#ff9ab8"/><stop offset=".6" stop-color="#c2416b"/><stop offset="1" stop-color="#3a0618"/></radialGradient>
<radialGradient id="bossGlow"><stop offset="0" stop-color="#ff3d6e" stop-opacity=".4"/><stop offset="1" stop-color="#ff3d6e" stop-opacity="0"/></radialGradient>
<radialGradient id="spark"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<radialGradient id="vign" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></radialGradient>
<g id="bossDrop"><circle r="120" fill="url(#bossGlow)"/><circle r="56" fill="url(#boss)"/><path d="M-30 -48l10 -30 12 18 8 -24 8 24 12 -18 10 30z" fill="#ffd23f" stroke="#ffb02e" stroke-width="3" stroke-linejoin="round"/>
<path d="M-26 -8l14 6M26 -8l-14 6" stroke="#2a0412" stroke-width="6" stroke-linecap="round"/><circle cx="-14" cy="6" r="6" fill="#ffe0a0"/><circle cx="14" cy="6" r="6" fill="#ffe0a0"/><path d="M-14 28q14 -10 28 0" fill="none" stroke="#2a0412" stroke-width="5" stroke-linecap="round"/></g>
<g id="eye"><ellipse rx="11" ry="13" fill="#fff"/><circle cx="-5" cy="1" r="5.5" fill="#140c2c"/><circle cx="-7" cy="-2" r="1.8" fill="#fff"/></g>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect width="1600" height="900" fill="url(#grid)"/>
<!-- stars and crumbs -->
<g fill="#fff">
<circle cx="120" cy="90" r="2"><animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/></circle>
<circle cx="420" cy="60" r="1.6"><animate attributeName="opacity" values=".3;1;.3" dur="4s" repeatCount="indefinite"/></circle>
<circle cx="1180" cy="80" r="2"><animate attributeName="opacity" values="1;.3;1" dur="3.6s" repeatCount="indefinite"/></circle>
<circle cx="1490" cy="150" r="1.6"><animate attributeName="opacity" values=".2;1;.2" dur="5s" repeatCount="indefinite"/></circle>
<circle cx="760" cy="40" r="1.4"/><circle cx="980" cy="130" r="1.4"/><circle cx="260" cy="200" r="1.2"/>
</g>
<g opacity=".7"><circle cx="300" cy="780" r="5" fill="#ffd23f"/><circle cx="1320" cy="820" r="5" fill="#22e6ff"/><circle cx="560" cy="860" r="4" fill="#b26bff"/><circle cx="1080" cy="760" r="4" fill="#3dffa2"/><circle cx="180" cy="560" r="4" fill="#ff4fd8"/><circle cx="1460" cy="420" r="5" fill="#ffd23f"/></g>
<!-- bosses circling the pair -->
<g transform="translate(800 560)">
<g><animateTransform attributeName="transform" type="rotate" values="0;360" dur="60s" repeatCount="indefinite"/>
<g transform="translate(560 0) scale(.9)"><g><animateTransform attributeName="transform" type="rotate" values="0;-360" dur="60s" repeatCount="indefinite"/><use href="#bossDrop"/></g></g>
<g transform="translate(-560 0) scale(.75)"><g><animateTransform attributeName="transform" type="rotate" values="0;-360" dur="60s" repeatCount="indefinite"/><use href="#bossDrop"/></g></g>
<g transform="translate(0 -420) scale(.6)"><g><animateTransform attributeName="transform" type="rotate" values="0;-360" dur="60s" repeatCount="indefinite"/><use href="#bossDrop"/></g></g>
</g></g>
<!-- meteor warnings that flash and hit -->
<g fill="none" stroke="#ff3d6e" stroke-width="5">
<circle cx="300" cy="300" r="70" opacity="0"><animate attributeName="opacity" values="0;.9;0;.9;0;0" keyTimes="0;.1;.2;.3;.4;1" dur="7s" repeatCount="indefinite"/></circle>
<circle cx="1300" cy="300" r="60" opacity="0"><animate attributeName="opacity" values="0;0;.9;0;.9;0;0" keyTimes="0;.5;.6;.7;.8;.9;1" dur="7s" repeatCount="indefinite"/></circle>
</g>
<g fill="#ff9a3d">
<circle cx="300" cy="300" r="0"><animate attributeName="r" values="0;0;80;0" keyTimes="0;.4;.46;1" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;.6;0" keyTimes="0;.4;.46;.6" dur="7s" repeatCount="indefinite"/></circle>
<circle cx="1300" cy="300" r="0"><animate attributeName="r" values="0;0;70;0" keyTimes="0;.9;.96;1" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;.6;0" keyTimes="0;.9;.96;1" dur="7s" repeatCount="indefinite"/></circle>
</g>
<!-- the shield over the pair -->
<g transform="translate(800 590)">
<circle r="250" fill="url(#shield)"><animate attributeName="r" values="245;262;245" dur="2.4s" repeatCount="indefinite"/></circle>
<circle r="250" fill="none" stroke="#3dffa2" stroke-width="3" stroke-dasharray="18 14" opacity=".55"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="30s" repeatCount="indefinite"/></circle>
</g>
<!-- two drops back to back, each watching its own side -->
<g transform="translate(700 600)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="3.2s" repeatCount="indefinite"/>
<path d="M0 -100C50 -100 92 -60 92 -8C92 48 50 88 0 88C-50 88 -92 48 -92 -8C-92 -60 -50 -100 0 -100Z" fill="url(#cyanDrop)"/>
<ellipse cx="-34" cy="-56" rx="22" ry="12" fill="#fff" opacity=".55" transform="rotate(-25 -34 -56)"/>
<use href="#eye" transform="translate(-44 -14) scale(1.3)"/><use href="#eye" transform="translate(-6 -14) scale(1.3)"/>
<path d="M-44 34q14 8 28 0" fill="none" stroke="#0b2a3a" stroke-width="5" stroke-linecap="round"/>
</g></g>
<g transform="translate(900 600) scale(-1 1)"><g><animateTransform attributeName="transform" type="translate" values="0 -8;0 2;0 -8" dur="3.2s" repeatCount="indefinite"/>
<path d="M0 -100C50 -100 92 -60 92 -8C92 48 50 88 0 88C-50 88 -92 48 -92 -8C-92 -60 -50 -100 0 -100Z" fill="url(#greenDrop)"/>
<ellipse cx="-34" cy="-56" rx="22" ry="12" fill="#fff" opacity=".55" transform="rotate(-25 -34 -56)"/>
<use href="#eye" transform="translate(-44 -14) scale(1.3)"/><use href="#eye" transform="translate(-6 -14) scale(1.3)"/>
<path d="M-48 30l22 -4" stroke="#0a3a24" stroke-width="5" stroke-linecap="round"/>
</g></g>
<!-- sparks rising from the shield -->
<g>
<circle cx="640" r="10" fill="url(#spark)"><animate attributeName="cy" values="680;380" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/></circle>
<circle cx="960" r="8" fill="url(#spark)"><animate attributeName="cy" values="700;400" dur="5s" begin="-2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="5s" begin="-2s" repeatCount="indefinite"/></circle>
<circle cx="800" r="9" fill="url(#spark)"><animate attributeName="cy" values="720;360" dur="6s" begin="-4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6s" begin="-4s" repeatCount="indefinite"/></circle>
</g>
<text x="800" y="200" text-anchor="middle" font-family="Russo One, Manrope, sans-serif" font-size="64" fill="#3dffa2" opacity=".16">ВОЛНА 30</text>
<rect width="1600" height="900" fill="url(#vign)"/>
</svg>
