<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<!-- «Граница»: награда за 20 матчей в «Захвате территории». Поле разделено живой неоновой границей: слева голубая половина, справа красная со штриховкой; по линии бегут огни, две капли смотрят друг на друга -->
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#060a22"/><stop offset="1" stop-color="#0c0420"/></linearGradient>
<linearGradient id="left" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22e6ff" stop-opacity=".02"/><stop offset="1" stop-color="#22e6ff" stop-opacity=".2"/></linearGradient>
<linearGradient id="right" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff3d6e" stop-opacity=".22"/><stop offset="1" stop-color="#ff3d6e" stop-opacity=".03"/></linearGradient>
<pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#8c7cff" stroke-opacity=".16" stroke-width="1.5"/><rect width="5" height="5" fill="#22e6ff" fill-opacity=".35"/></pattern>
<pattern id="hatch" width="46" height="46" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)"><rect width="14" height="46" fill="#ff3d6e" fill-opacity=".16"/>
<animateTransform attributeName="patternTransform" type="translate" additive="sum" values="0 0;46 0" dur="6s" repeatCount="indefinite"/></pattern>
<radialGradient id="halo"><stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
<radialGradient id="cyanDrop" cx=".35" cy=".3"><stop offset="0" stop-color="#ffffff"/><stop offset=".3" stop-color="#9ff6ff"/><stop offset=".75" stop-color="#22c8e6"/><stop offset="1" stop-color="#0b4a66"/></radialGradient>
<radialGradient id="pinkDrop" cx=".35" cy=".3"><stop offset="0" stop-color="#ffffff"/><stop offset=".3" stop-color="#ffb3ec"/><stop offset=".75" stop-color="#ff4fd8"/><stop offset="1" stop-color="#6a0f55"/></radialGradient>
<radialGradient id="cyanGlow"><stop offset="0" stop-color="#22e6ff" stop-opacity=".45"/><stop offset="1" stop-color="#22e6ff" stop-opacity="0"/></radialGradient>
<radialGradient id="pinkGlow"><stop offset="0" stop-color="#ff4fd8" stop-opacity=".45"/><stop offset="1" stop-color="#ff4fd8" stop-opacity="0"/></radialGradient>
<radialGradient id="vign" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></radialGradient>
<clipPath id="leftClip"><rect x="-200" y="0" width="1000" height="900"><animate attributeName="width" values="1000;1080;930;1000" dur="22s" repeatCount="indefinite"/></rect></clipPath>
<g id="eyes"><ellipse cx="-17" cy="-6" rx="11" ry="13" fill="#fff"/><ellipse cx="17" cy="-6" rx="11" ry="13" fill="#fff"/><circle cx="-13" cy="-4" r="5.5" fill="#140c2c"/><circle cx="21" cy="-4" r="5.5" fill="#140c2c"/><circle cx="-11" cy="-7" r="1.8" fill="#fff"/><circle cx="23" cy="-7" r="1.8" fill="#fff"/></g>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect width="1600" height="900" fill="url(#grid)"/>
<!-- the two halves: the border sways, so the halves follow it -->
<rect width="1600" height="900" fill="url(#right)"/>
<rect width="1600" height="900" fill="url(#hatch)"/>
<g clip-path="url(#leftClip)"><rect x="0" width="1600" height="900" fill="#060a22"/><rect width="1600" height="900" fill="url(#grid)"/><rect x="0" width="800" height="900" fill="url(#left)"><animate attributeName="width" values="800;880;730;800" dur="22s" repeatCount="indefinite"/></rect></g>
<!-- the border line -->
<g><animateTransform attributeName="transform" type="translate" values="0 0;80 0;-70 0;0 0" dur="22s" repeatCount="indefinite"/>
<rect x="680" y="0" width="240" height="900" fill="url(#halo)" opacity=".35"/>
<rect x="797" y="0" width="6" height="900" fill="#ffffff" opacity=".9"/>
<rect x="790" y="0" width="20" height="900" fill="#ffffff" opacity=".12"/>
<circle cx="800" r="26" fill="url(#halo)"><animate attributeName="cy" values="-40;940" dur="4.2s" repeatCount="indefinite"/></circle>
<circle cx="800" r="18" fill="url(#halo)"><animate attributeName="cy" values="-40;940" dur="4.2s" begin="-2.1s" repeatCount="indefinite"/></circle>
<circle cx="800" r="34" fill="url(#halo)" opacity=".8"><animate attributeName="cy" values="940;-40" dur="7s" repeatCount="indefinite"/></circle>
</g>
<!-- small bots on each half -->
<g fill="#22e6ff" opacity=".75">
<circle cx="180" cy="160" r="9"><animate attributeName="cy" values="160;176;160" dur="5s" repeatCount="indefinite"/></circle>
<circle cx="320" cy="720" r="12"><animate attributeName="cx" values="320;345;320" dur="7s" repeatCount="indefinite"/></circle>
<circle cx="560" cy="250" r="7"><animate attributeName="opacity" values="1;.4;1" dur="3s" repeatCount="indefinite"/></circle>
<circle cx="110" cy="480" r="8"/>
<circle cx="610" cy="820" r="10"><animate attributeName="cy" values="820;800;820" dur="6s" repeatCount="indefinite"/></circle>
</g>
<g fill="#ff4fd8" opacity=".75">
<circle cx="1420" cy="190" r="10"><animate attributeName="cy" values="190;210;190" dur="6s" repeatCount="indefinite"/></circle>
<circle cx="1260" cy="760" r="8"><animate attributeName="cx" values="1260;1236;1260" dur="8s" repeatCount="indefinite"/></circle>
<circle cx="1050" cy="120" r="7"><animate attributeName="opacity" values="1;.4;1" dur="3.4s" repeatCount="indefinite"/></circle>
<circle cx="1510" cy="560" r="12"/>
<circle cx="1000" cy="840" r="9"><animate attributeName="cy" values="840;820;840" dur="5s" repeatCount="indefinite"/></circle>
</g>
<!-- two drops looking at each other across the border -->
<g transform="translate(470 560)">
<circle r="190" fill="url(#cyanGlow)"/>
<g><animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="3.6s" repeatCount="indefinite"/>
<path d="M0 -92C46 -92 84 -54 84 -6C84 46 46 82 0 82C-46 82 -84 46 -84 -6C-84 -54 -46 -92 0 -92Z" fill="url(#cyanDrop)"/>
<ellipse cx="-30" cy="-50" rx="22" ry="12" fill="#fff" opacity=".55" transform="rotate(-25 -30 -50)"/>
<use href="#eyes" transform="translate(8 -2) scale(1.25)"/>
<path d="M-10 32Q4 42 20 32" fill="none" stroke="#0b2a3a" stroke-width="5" stroke-linecap="round"/>
</g></g>
<g transform="translate(1130 560) scale(-1 1)">
<circle r="190" fill="url(#pinkGlow)"/>
<g><animateTransform attributeName="transform" type="translate" values="0 -10;0 4;0 -10" dur="3.9s" repeatCount="indefinite"/>
<path d="M0 -92C46 -92 84 -54 84 -6C84 46 46 82 0 82C-46 82 -84 46 -84 -6C-84 -54 -46 -92 0 -92Z" fill="url(#pinkDrop)"/>
<ellipse cx="-30" cy="-50" rx="22" ry="12" fill="#fff" opacity=".55" transform="rotate(-25 -30 -50)"/>
<use href="#eyes" transform="translate(8 -2) scale(1.25)"/>
<path d="M-12 22l20 -8" stroke="#3a0a30" stroke-width="5" stroke-linecap="round"/>
<path d="M-6 36Q6 30 20 36" fill="none" stroke="#3a0a30" stroke-width="5" stroke-linecap="round"/>
</g></g>
<!-- percent marks drifting on each side -->
<g font-family="Russo One, Manrope, sans-serif" font-size="58" opacity=".22">
<text x="150" y="110" fill="#22e6ff">52%<animate attributeName="opacity" values="1;.5;1" dur="6s" repeatCount="indefinite"/></text>
<text x="1320" y="110" fill="#ff4fd8">48%<animate attributeName="opacity" values=".5;1;.5" dur="6s" repeatCount="indefinite"/></text>
</g>
<rect width="1600" height="900" fill="url(#vign)"/>
</svg>
